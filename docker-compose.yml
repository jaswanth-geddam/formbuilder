version: "3.9"
services:
  server:
    build: ./server
    ports:
      - "2233:2233"
    environment:
      MONGO_URI: mongodb://mongo:27017/formbuilder
    depends_on:
      mongo:
        condition: service_healthy
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  mongodata:
